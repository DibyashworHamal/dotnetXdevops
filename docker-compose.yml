services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    container_name: eshop-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    container_name: eshop-web
    ports:
      - "${WEB_HOST_PORT}:8080" 
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${DOTNET_ENV}
      - ConnectionStrings__CatalogConnection=Server=db;Database=CatalogDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__IdentityConnection=Server=db;Database=IdentityDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
  api:
    build:
      context: .
      dockerfile: src/PublicApi/Dockerfile
    container_name: eshop-api
    ports:
      - "${API_HOST_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${DOTNET_ENV}
      - ConnectionStrings__CatalogConnection=Server=db;Database=CatalogDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__IdentityConnection=Server=db;Database=IdentityDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;