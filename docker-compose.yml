services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    container_name: eshop-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 7
      start_period: 40s
  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    container_name: eshop-web
    ports:
      - "${WEB_HOST_PORT}:8080" 
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${DOTNET_ENV}
      - ConnectionStrings__CatalogConnection=Server=db;Database=CatalogDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__IdentityConnection=Server=db;Database=IdentityDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
  api:
    build:
      context: .
      dockerfile: src/PublicApi/Dockerfile
    container_name: eshop-api
    ports:
      - "${API_HOST_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${DOTNET_ENV}
      # The API also needs to talk to the database!
      - ConnectionStrings__CatalogConnection=Server=db;Database=CatalogDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__IdentityConnection=Server=db;Database=IdentityDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;